services:
  # 1. Backend Web Service (Go + Docker)
  - type: web
    name: bible-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8080

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: bible-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
