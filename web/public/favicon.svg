<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BibleMemory" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>BibleMemory</title>
  <!-- background -->
  <rect width="64" height="64" rx="14" fill="#17323D"/>

  <!-- open book: left and right pages -->
  <path d="M32 19 C26 16 18 15.5 11 18 V46.5 C18 44.5 26 45 32 48.5 Z" fill="#F2F5F0"/>
  <path d="M32 19 C38 16 46 15.5 53 18 V46.5 C46 44.5 38 45 32 48.5 Z" fill="#E1E9E3"/>
  <path d="M32 19 V48.5" stroke="#17323D" stroke-opacity="0.28" stroke-width="1.2"/>

  <!-- left page: verse lines -->
  <g fill="#17323D" fill-opacity="0.6">
    <rect x="16" y="24" width="11" height="2" rx="1"/>
    <rect x="16" y="29" width="11" height="2" rx="1"/>
    <rect x="16" y="34" width="8" height="2" rx="1"/>
  </g>

  <!-- right page: verse lines, last one has the missing word -->
  <g fill="#17323D" fill-opacity="0.6">
    <rect x="37" y="24" width="11" height="2" rx="1"/>
    <rect x="37" y="29" width="11" height="2" rx="1"/>
    <rect x="37" y="34" width="4" height="2" rx="1"/>
  </g>
  <path d="M44 35 H48.5" stroke="#17323D" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 3.2"/>

  <!-- ribbon bookmark -->
  <path d="M29 47.5 H35 V57.5 L32 54.5 L29 57.5 Z" fill="#F0B429"/>
</svg>
